# Style kits for halloween.US (commerce side of Shop the look).
# Specs: docs/specs/holidays-and-content.md "Style kits" and docs/specs/commerce.md "Style kits and products".
# kitItemId, anchors, specText, quantity and required mirror ../packs/halloween.yaml exactly; the loader
# cross-checks them. anchorCategory is the primary anchor; sortOrder is placement prominence
# (door, porch, roofline, then accents). specAttributes are our own words, never merchant text.
# currentProductId points into ../commerce/products.json.

holidayId: halloween
packId: halloween.US
packVersion: 1.0.1
kits:
  - kitId: halloween.house_exterior
    holidayId: halloween
    sceneType: house_exterior
    version: 1.0.0
    status: published
    items:
      - kitItemId: halloween.house_exterior.cobwebs
        sortOrder: 1
        anchorCategory: porch_rail
        anchors: [porch_rail, column, door_frame]
        specText: thin stretched white synthetic cobweb across one railing corner or wrapped loosely around the top of a porch post, never across the door opening
        specAttributes:
          category: cobweb
          sizeRange: 1-2 stretched packs
          material: synthetic fiber
          colorFamily: white
          lit: false
          indoorOutdoor: outdoor
          countRange: 1-2
        quantity: { subtle: [0, 0], classic: [1, 2], abundant: [2, 3] }
        required: []
        currentProductId: prod_stretch_cobweb_pack
      - kitItemId: halloween.house_exterior.jack_o_lanterns
        sortOrder: 2
        anchorCategory: porch_steps
        anchors: [porch_steps, planter, walkway_edge]
        specText: two to four carved orange pumpkins with simple friendly or classic triangle-eye faces, lit from inside by flameless candles, beside the steps or path, not on a tread
        specAttributes:
          category: carved pumpkins
          sizeRange: 8-14 in
          material: foam pumpkins with flameless LED candles
          colorFamily: orange, warm glow
          lit: true
          lightColor: warm amber flicker (flameless)
          indoorOutdoor: outdoor
          countRange: 2-4
        quantity: { subtle: [1, 1], classic: [1, 2], abundant: [2, 3] }
        required: [subtle, classic, abundant]
        currentProductId: prod_foam_jack_o_lanterns_lit
      - kitItemId: halloween.house_exterior.pumpkin_group
        sortOrder: 3
        anchorCategory: porch_steps
        anchors: [porch_steps, planter]
        specText: a group of three to five uncarved orange and white pumpkins of mixed sizes with a few green-striped gourds beside the entry
        specAttributes:
          category: pumpkins
          sizeRange: 6-14 in each
          material: faux pumpkins and gourds
          colorFamily: orange, white
          lit: false
