        sortOrder: 1
        anchorCategory: front_door
        anchors: [front_door]
        specText: a 24 to 30 inch mixed evergreen wreath with a red velvet bow, centered on the existing front door
        specAttributes:
          category: wreath
          sizeRange: 24-30 in
          material: artificial mixed evergreen, velvet bow
          colorFamily: green, red
          lit: false
          indoorOutdoor: outdoor
          countRange: '1'
        quantity: { subtle: [1, 1], classic: [1, 1], abundant: [1, 1] }
