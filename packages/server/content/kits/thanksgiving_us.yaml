    sceneType: house_exterior
    version: 1.0.0
    status: published
    items:
      - kitItemId: thanksgiving_us.house_exterior.wreath_autumn
        sortOrder: 1
        anchorCategory: front_door
        anchors: [front_door]
        specText: a 22 to 26 inch wreath of orange and russet maple leaves with small pinecones and wheat, centered on the existing front door
        specAttributes:
          category: wreath
          sizeRange: 22-26 in
          material: artificial maple leaves, pinecones, wheat
          colorFamily: orange, russet
          lit: false
          indoorOutdoor: outdoor
          countRange: '1'
        quantity: { subtle: [1, 1], classic: [1, 1], abundant: [1, 1] }
        required: [subtle, classic, abundant]
        currentProductId: prod_wreath_autumn_maple_24in
