        sortOrder: 3
        anchorCategory: porch_steps
        anchors: [porch_steps, planter]
        specText: a pair of brushed-gold metal and glass lanterns with flameless pillar candles beside the entry, not on a step tread
        specAttributes:
          category: lantern
          sizeRange: 12-18 in
          material: brushed-gold metal, glass, flameless pillar
