# Style kits for new_years_eve.US (commerce side of Shop the look).
# Specs: docs/specs/holidays-and-content.md "Style kits" and docs/specs/commerce.md "Style kits and products".
# kitItemId, anchors, specText, quantity and required mirror ../packs/new_years_eve.yaml exactly; the loader
# cross-checks them. anchorCategory is the primary anchor; sortOrder is placement prominence
# (door, porch, roofline, then accents). specAttributes are our own words, never merchant text.
# currentProductId points into ../commerce/products.json.

holidayId: new_years_eve
packId: new_years_eve.US
packVersion: 1.0.1
kits:
  - kitId: new_years_eve.house_exterior
    holidayId: new_years_eve
    sceneType: house_exterior
    version: 1.0.0
    status: published
    items:
      - kitItemId: new_years_eve.house_exterior.door_wreath_ornament
        sortOrder: 1
        anchorCategory: front_door
        anchors: [front_door]
        specText: a 20 to 24 inch wreath made of shiny and matte gold, silver and white round ornaments, centered on the existing front door
        specAttributes:
          category: wreath
          sizeRange: 20-24 in
          material: shatterproof ornaments on a wire frame
          colorFamily: gold, silver, white
          lit: false
          indoorOutdoor: outdoor
          countRange: '1'
        quantity: { subtle: [1, 1], classic: [1, 1], abundant: [1, 1] }
        required: [subtle, classic, abundant]
        currentProductId: prod_ornament_wreath_gold_silver_22in
      - kitItemId: new_years_eve.house_exterior.garland_metallic
        sortOrder: 2
        anchorCategory: door_frame
        anchors: [door_frame, porch_rail, column]
        specText: a full garland of gold and silver metallic tinsel with small round gold and silver ornaments following the door frame or rail
        specAttributes:
          category: garland
          sizeRange: 6-9 ft
          material: metallic tinsel, shatterproof ornaments
          colorFamily: gold, silver
          lit: false
          indoorOutdoor: outdoor
          countRange: 1-2
        quantity: { subtle: [0, 1], classic: [1, 1], abundant: [1, 2] }
