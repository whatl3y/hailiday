name: holiday

# One-command local stack: `docker compose up --build` (or `pnpm docker:up`) brings up
# Postgres, S3-compatible object storage (RustFS), a mail catcher (Mailpit), runs
# migrations, storage setup and seed data, then starts the API (which serves the web app)
# and the workers. Open http://localhost:8080 when the api service is healthy.
#
# Configuration: copy .env.example to .env and edit it; migrate, api and workers load that
# one file (it is optional, so the stack also runs with no .env at all). `environment:`
# below only overrides what must differ inside the Docker network (database, storage and
# mail endpoints, the API port and the SMTP mailer), so the host-oriented values in .env
# work unchanged for `pnpm dev`. Provider keys come only from .env, never from your shell,
# and with no keys every provider runs in fixture mode. `pnpm docker:e2e` adds
# docker-compose.e2e.yml, which forces fixture mode for the browser tests and runs as its
# own Compose project, so resetting it never deletes this stack's data.
#
#   pnpm docker:up      # build and start everything in the background
#   pnpm docker:infra   # only Postgres, storage and Mailpit (for `pnpm dev` on the host)
#   pnpm docker:e2e     # the full stack in fixture mode for the e2e suite (project holiday-e2e)
#   pnpm docker:logs    # follow logs
#   pnpm docker:down    # stop (keeps data)
#   pnpm docker:reset   # stop and delete all local data volumes
#   pnpm docker:e2e:down / docker:e2e:reset / docker:e2e:logs   # the same for the e2e stack only
#
# URLs: app http://localhost:8080 · mail http://localhost:8025 · storage console
# http://localhost:9001 · Postgres localhost:5434 (ports: APP_PORT, MAILPIT_PORT,
# STORAGE_CONSOLE_PORT, DB_PORT and STORAGE_PORT in .env).

x-app-env-file: &app-env-file
  - path: .env
    required: false

# In-network endpoints. Browser-facing URLs stay interpolated so .env can change them.
x-app-env: &app-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/holiday
  S3_ENDPOINT: http://storage:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  SMTP_URL: smtp://mailpit:1025
  EMAIL_PROVIDER: smtp
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: holiday
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - holiday-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d holiday']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage for uploads, renders, heroes and share cards. The
  # credentials default to the same values as the config module's local defaults.
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-holiday}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-holiday-dev-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${STORAGE_PORT:-9000}:9000'
      - '${STORAGE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - holiday-storage:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:9000/health >/dev/null || wget -qO- http://127.0.0.1:9000/health >/dev/null || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Catches every email the app sends (magic links); browse them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_PORT:-8025}:8025'
    restart: unless-stopped

  # Release phase: migrations, bucket setup (CORS, public-read policy) and seed content.
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.heroku.release
    env_file: *app-env-file
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.heroku.web
    env_file: *app-env-file
    environment:
      <<: *app-env
      PORT: '8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - '${APP_PORT:-8080}:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:8080/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  workers:
    build:
      context: .
      dockerfile: deploy/Dockerfile.heroku.worker
    env_file: *app-env-file
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  holiday-pgdata:
  holiday-storage:
